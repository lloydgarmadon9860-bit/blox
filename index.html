<head>

<title>Blox</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111214;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:#2f3136;color:#fff;font-weight:600}
button:hover{filter:brightness(1.15)}
button.pri{background:#00a2ff}
button.grn{background:#02b757}
button.red{background:#e03131}
button.sm{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;background:#1e1f22;color:#fff;border:1px solid #3a3c42;border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus{border-color:#00a2ff}
.hidden{display:none!important}
.page{position:fixed;inset:0}
/* login */
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1d4ed8 0,#111214 55%)}
.lbox{width:min(380px,92vw);background:#191a1d;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0008}
.logo{font-size:34px;font-weight:900;letter-spacing:-1px}
.logo b{display:inline-block;background:#fff;color:#111;padding:0 8px;border-radius:6px;transform:rotate(-8deg);margin-right:4px}
.lerr{color:#ff6b6b;font-size:13px;min-height:16px}
.muted{color:#9aa0a6;font-size:13px}
.link{color:#00a2ff;cursor:pointer}
/* home */
#home{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#191a1d;border-bottom:1px solid #26282c;flex-wrap:wrap}
.top .logo{font-size:24px}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;color:#bbb}
.tabs button.on{background:#2f3136;color:#fff}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.content{flex:1;overflow:auto;padding:18px}
h2{font-size:20px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:#1c1d21;border-radius:12px;overflow:hidden;border:1px solid #26282c;display:flex;flex-direction:column}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
.card .b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .n{font-weight:800}
.card .row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.online{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.orow{display:flex;align-items:center;gap:10px;background:#1c1d21;padding:8px 12px;border-radius:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#02b757}
/* avatar */
#tabAvatar{display:flex;gap:16px;height:100%;flex-wrap:wrap}
#avStage{flex:1 1 300px;min-height:340px;border-radius:14px;overflow:hidden;background:#24262b;position:relative}
#avPanel{flex:1 1 320px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:#24262b;font-weight:500}
.opts button.on{outline:2px solid #00a2ff}
.sw{width:34px;height:34px;border-radius:8px;padding:0;border:2px solid #0000}
.sw.on{border-color:#fff}
/* play */
#playStage,#studioStage{position:absolute;inset:0}
.hud{position:absolute;pointer-events:none;inset:0}
.hud>*{pointer-events:auto}
#pMenu{position:absolute;top:10px;left:10px;display:flex;gap:6px}
#pMenu button{background:#000a}
#chatBox{position:absolute;top:56px;left:10px;width:min(340px,70vw);display:flex;flex-direction:column;gap:6px}
#chatLog{max-height:180px;overflow:auto;background:#0006;border-radius:10px;padding:8px;font-size:14px;display:flex;flex-direction:column;gap:3px;text-shadow:0 1px 2px #000}
#chatLog b{color:#7cc8ff}
#chatLog .sys{color:#ffd43b}
#chatIn{background:#000a;border:1px solid #fff3}
#plist{position:absolute;top:10px;right:10px;background:#0007;border-radius:10px;padding:8px 12px;min-width:140px;font-size:14px}
#plist div{padding:2px 0}
#banner{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:40px;font-weight:900;text-shadow:0 3px 10px #000;pointer-events:none;text-align:center}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff4;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff8}
#jumpBtn{position:absolute;right:30px;bottom:36px;width:90px;height:90px;border-radius:50%;background:#fff3;border:2px solid #fff6;font-size:30px;touch-action:none}
#ver{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff8;pointer-events:none}
/* studio */
#sBar{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;padding:8px;background:#191a1df0;flex-wrap:wrap;align-items:center;border-bottom:1px solid #2b2d31}
#sBar .g{display:flex;gap:4px;padding-right:8px;border-right:1px solid #333;flex-wrap:wrap}
#sBar button.on{background:#00a2ff}
#sProps{position:absolute;right:8px;top:110px;width:250px;max-height:calc(100% - 130px);overflow:auto;background:#191a1df0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
#sProps label{color:#aaa;font-size:12px}
.xyz{display:flex;gap:4px}
.xyz input{padding:6px}
#sGame{position:absolute;left:8px;top:110px;width:230px;background:#191a1df0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
@media (max-width:700px){#sGame{display:none}#sGame.open{display:flex;z-index:5}#sProps{width:200px;top:auto;bottom:8px;max-height:45%}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:10px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50}
.modal>div{background:#1c1d21;padding:20px;border-radius:14px;width:min(420px,92vw);display:flex;flex-direction:column;gap:10px}
.tpl{display:flex;gap:8px}
.tpl button{flex:1;padding:16px 8px;background:#24262b}
.tpl button.on{outline:2px solid #00a2ff}
</style>
</head>

<div id="login" class="page">

      <h2>🔥 Hry</h2>
      <div class="grid" id="gameGrid"></div>
    </div>
    <div id="tabAvatar" class="hidden">
      <div id="avStage"></div>
      <div id="avPanel"></div>
    </div>
    <div id="tabCreate" class="hidden">
      <div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">🛠️ Moje hry</h2><button class="grn" id="newGame">+ Nová hra</button></div>
      <div class="grid" id="myGrid"></div>
    </div>
  </div>
</div>

<div id="play" class="page hidden">
  <div id="playStage"></div>
  <div class="hud">
    <div id="pMenu"><button id="pLeave">⬅ Odejít</button><button id="pChatT">💬</button><button id="pReset">🔄</button></div>
    <div id="chatBox"><div id="chatLog"></div><input id="chatIn" maxlength="200" placeholder="Napiš zprávu (Enter / klávesa /)"></div>
    <div id="plist"></div>
    <div id="banner"></div>
    <div id="joy" class="hidden"><div id="knob"></div></div>
    <button id="jumpBtn" class="hidden">⤒</button>
    <div id="ver"></div>
  </div>
</div>

<div id="studio" class="page hidden">
  <div id="studioStage"></div>
  <div id="sBar">
    <div class="g"><button id="sExit">⬅</button><button id="sGameT" class="sm">⚙️ Hra</button></div>
    <div class="g"><button class="sm" data-add="box">+ Blok</button><button class="sm" data-add="ball">+ Koule</button><button class="sm" data-add="cyl">+ Válec</button></div>
    <div class="g"><button class="sm on" id="mMove">✥ Posun</button><button class="sm" id="mScale">⤢ Velikost</button></div>
    <div class="g"><button class="sm" id="sDup">⧉</button><button class="sm" id="sDel">🗑</button><button class="sm" id="sUndo">↶</button></div>
    <div class="g" style="border:0"><button class="sm" id="sSave">💾 Uložit</button><button class="sm grn" id="sTest">▶ Test</button></div>
  </div>
  <div id="sGame">
    <b>⚙️ Hra</b>
    <label class="muted">Název</label><input id="gName" maxlength="40">
    <label class="muted">Popis</label><textarea id="gDesc" rows="3" maxlength="300"></textarea>
    <label class="muted">Barva oblohy</label><input id="gSky" type="color">
    <label style="display:flex;gap:8px;align-items:center"><input id="gPub" type="checkbox" style="width:auto"> Zveřejnit (uvidí ji všichni)</label>
    <div class="muted" id="gCount"></div>
  </div>
  <div id="sProps" class="hidden"></div>
</div>

<div id="toast"></div>

<script type="module">

const R = new THREE.WebGLRenderer({ antialias: true });

function makeScene(sky) {

  s.background = new THREE.Color(sky || '#8fd3ff');
  s.fog = new THREE.Fog(s.background, 250, 1000);
  const hemi = new THREE.HemisphereLight('#ffffff', '#4a5060', 1.1);

/* ================= AVATAR ================= */
const AVDEF = { head: '#f5cd30', torso: '#0d69ac', arms: '#f5cd30', legs: '#a4bd47', face: 'smile', hat: 'none', hatColor: '#e03131', shirt: 'none', shirtColor: '#ffffff' };

const FACES = { smile: '🙂 Úsměv', grin: '😁 Smích', cool: '😎 Brýle', wink: '😉 Mrk', angry: '😠 Zlost', surprised: '😮 Údiv', sleepy: '😴 Ospalý', robot: '🤖 Robot' };
const HATS = { none: 'Nic', cap: '🧢 Kšiltovka', top: '🎩 Cylindr', crown: '👑 Koruna', horns: '😈 Rohy', cat: '🐱 Uši', cone: '🎉 Kornout', halo: '😇 Svatozář' };
const SHIRTS = { none: 'Nic', stripe: 'Proužky', star: '⭐ Hvězda', heart: '❤️ Srdce', num: '7️⃣ Číslo', bolt: '⚡ Blesk' };

function canvasTex(cv) { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; }
function faceTex(av) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = av.head; g.fillRect(0, 0, 128, 128);

    case 'cool': g.fillRect(22, 40, 36, 18); g.fillRect(70, 40, 36, 18); g.fillRect(56, 44, 16, 5); arc(64, 70, 20, 0.2, 0.8); break;
    case 'wink': eye(42, 50); g.beginPath(); g.moveTo(76, 50); g.lineTo(96, 50); g.stroke(); arc(64, 68, 22, 0.15, 0.85); break;
    case 'angry': eye(42, 56); eye(86, 56); g.beginPath(); g.moveTo(28, 36); g.lineTo(54, 46); g.moveTo(100, 36); g.lineTo(74, 46); g.stroke(); arc(64, 104, 20, 1.15, 1.85); break;
    case 'surprised': eye(42, 46, 9); eye(86, 46, 9); g.beginPath(); g.arc(64, 86, 11, 0, 7); g.stroke(); break;
    case 'sleepy': g.beginPath(); g.moveTo(30, 52); g.lineTo(54, 52); g.moveTo(74, 52); g.lineTo(98, 52); g.stroke(); g.beginPath(); g.arc(64, 84, 8, 0, 7); g.stroke(); break;
    case 'robot': g.fillStyle = '#19e3ff'; g.fillRect(28, 40, 26, 14); g.fillRect(74, 40, 26, 14); g.fillStyle = '#111'; for (let i = 0; i < 5; i++) g.fillRect(32 + i * 13, 78, 8, 12); break;
    default: eye(42, 50); eye(86, 50); arc(64, 64, 24, 0.15, 0.85);
  }
  return canvasTex(cv);
}
function shirtTex(av) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = av.torso; g.fillRect(0, 0, 128, 128);
  g.fillStyle = av.shirtColor; g.strokeStyle = av.shirtColor;
  const star = (cx, cy, R1, R2) => { g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? R2 : R1, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } g.closePath(); g.fill(); };

    case 'stripe': for (let y = 10; y < 128; y += 28) g.fillRect(0, y, 128, 12); break;
    case 'star': star(64, 66, 40, 17); break;
    case 'heart': g.beginPath(); g.moveTo(64, 104); g.bezierCurveTo(10, 66, 30, 18, 64, 44); g.bezierCurveTo(98, 18, 118, 66, 64, 104); g.fill(); break;
    case 'num': g.font = 'bold 96px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('7', 64, 70); break;

  }

const mat = (c, map) => new THREE.MeshStandardMaterial({ color: map ? 0xffffff : c, map: map || null, roughness: 0.6 });
function makeHat(av) {
  const c = new THREE.MeshStandardMaterial({ color: av.hatColor, roughness: 0.5 });
  const g = new THREE.Group();
  const M = (geo, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(geo, m || c); o.position.set(x, y, z); o.castShadow = true; g.add(o); return o; };

    case 'top': M(new THREE.CylinderGeometry(0.9, 0.9, 0.08, 24), c, 0, 0, 0); M(new THREE.CylinderGeometry(0.55, 0.55, 1, 24), c, 0, 0.5, 0); break;
    case 'crown': { const gold = new THREE.MeshStandardMaterial({ color: '#ffd43b', metalness: 0.8, roughness: 0.25 }); M(new THREE.CylinderGeometry(0.62, 0.62, 0.35, 8), gold, 0, 0.15, 0); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; M(new THREE.ConeGeometry(0.12, 0.3, 4), gold, Math.sin(a) * 0.55, 0.45, Math.cos(a) * 0.55); } break; }
    case 'horns': { M(new THREE.ConeGeometry(0.15, 0.6, 12), c, -0.45, 0.2, 0).rotation.z = 0.4; M(new THREE.ConeGeometry(0.15, 0.6, 12), c, 0.45, 0.2, 0).rotation.z = -0.4; break; }
    case 'cat': M(new THREE.ConeGeometry(0.25, 0.5, 4), c, -0.38, 0.2, 0); M(new THREE.ConeGeometry(0.25, 0.5, 4), c, 0.38, 0.2, 0); break;
    case 'cone': M(new THREE.ConeGeometry(0.5, 1.2, 20), c, 0, 0.6, 0); break;
    case 'halo': { const m = new THREE.MeshStandardMaterial({ color: '#fff3a0', emissive: '#ffe066', emissiveIntensity: 0.8 }); M(new THREE.TorusGeometry(0.5, 0.08, 8, 24), m, 0, 0.7, 0).rotation.x = Math.PI / 2; break; }
    default: return null;
  }
  return g;
}
function makeAvatar(av0) {
  const av = { ...AVDEF, ...(av0 || {}) };

async function startPlay(id, testGame) {

    catch (e) { fail(e); return; }
    if (!g.published && g.owner !== me.uid && !isOwner()) { toast('Tahle hra je soukromá 🔒'); return; }

  }

        pos.setComponent(ax, d > 0 ? b.min[ax] - HW - 0.001 : b.max[ax] + HW + 0.001);
      }
    }
  }
  const others = {};
  const banner = (t, ms = 2500) => { $('banner').textContent = t; clearTimeout(banner.t); if (ms) banner.t = setTimeout(() => $('banner').textContent = '', ms); };
  function die() {
    if (P.dead > 0) return;
    P.dead = 1.6; fig.visible = false; banner('💥 Au!', 1500);
  }
  function respawn() { P.pos.set(...P.check); P.vel.set(0, 0, 0); fig.visible = true; P.dead = 0; }
  const sysMsg = t => { const d = document.createElement('div'); d.className = 'sys'; d.textContent = t; $('chatLog').appendChild(d); $('chatLog').scrollTop = 1e9; };

  // camera input
  let camPtr = null, lx = 0, ly = 0;
  const el = R.domElement;
  const cpd = e => { if (camPtr !== null) return; camPtr = e.pointerId; lx = e.clientX; ly = e.clientY; };
  const cpm = e => { if (e.pointerId !== camPtr) return; cam.yaw -= (e.clientX - lx) * 0.006; cam.pitch = Math.max(-0.3, Math.min(1.35, cam.pitch + (e.clientY - ly) * 0.005)); lx = e.clientX; ly = e.clientY; };
  const cpu = e => { if (e.pointerId === camPtr) camPtr = null; };
  const wheel = e => { cam.dist = Math.max(4, Math.min(60, cam.dist * (e.deltaY > 0 ? 1.1 : 0.9))); };
  el.addEventListener('pointerdown', cpd); addEventListener('pointermove', cpm); addEventListener('pointerup', cpu); addEventListener('pointercancel', cpu); el.addEventListener('wheel', wheel, { passive: true });
  // touch controls
  const joy = { x: 0, y: 0, id: null }; let jumpHeld = false;
  $('joy').classList.toggle('hidden', !isTouch); $('jumpBtn').classList.toggle('hidden', !isTouch);
  const J = $('joy'), K = $('knob');
  J.onpointerdown = e => { joy.id = e.pointerId; J.setPointerCapture(e.pointerId); J.onpointermove(e); };
  J.onpointermove = e => {
    if (e.pointerId !== joy.id) return;
    const r = J.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const l = Math.hypot(dx, dy), m = 50; if (l > m) { dx *= m / l; dy *= m / l; }
    joy.x = dx / m; joy.y = dy / m; K.style.left = (40 + dx) + 'px'; K.style.top = (40 + dy) + 'px';
  };
  J.onpointerup = J.onpointercancel = () => { joy.id = null; joy.x = joy.y = 0; K.style.left = K.style.top = '40px'; };
  $('jumpBtn').onpointerdown = e => { e.preventDefault(); jumpHeld = true; };
  $('jumpBtn').onpointerup = $('jumpBtn').onpointercancel = $('jumpBtn').onpointerleave = () => jumpHeld = false;

  // network
  const online = !testGame;
  const presId = online ? g.id + '_' + me.uid : null;
  let sendT = 0, lastSent = '', unsubs = [], joinT = Date.now();
  if (online) {
    unsubs.push(onSnapshot(query(C('bx_pres'), where('g', '==', g.id)), s => {
      const seen = new Set();
      s.docs.forEach(d => {
        const o = d.data(); if (o.uid === me.uid || !fresh(o)) return;
        seen.add(o.uid);
        let r = others[o.uid];
        if (!r || r.avKey !== JSON.stringify(o.av)) {
          if (r) scene.remove(r.fig);
          const f = makeAvatar(o.av); const t = textSprite(o.name); t.position.y = 6.3; f.add(t);
          f.position.set(o.x, o.y, o.z); scene.add(f);
          if (!r) sysMsg('👋 ' + o.name + ' se připojil');
          r = others[o.uid] = { fig: f, name: o.name, avKey: JSON.stringify(o.av), tgt: new THREE.Vector3(o.x, o.y, o.z), ry: o.ry || 0, sp: 0, air: false, bubble: null };
        }
        r.tgt.set(o.x, o.y, o.z); r.ry = o.ry || 0; r.sp = o.sp || 0; r.air = !!o.air; r.fig.visible = !o.dead; r.t = o.t;
      });
      for (const u of Object.keys(others)) if (!seen.has(u)) { scene.remove(others[u].fig); sysMsg('🚪 ' + others[u].name + ' odešel'); delete others[u]; }
      renderPlist();
    }, () => {}));
    unsubs.push(onSnapshot(query(C('bx_chat'), where('g', '==', g.id)), s => {
      const msgs = s.docs.map(d => d.data()).filter(m => m.t > joinT - 600000).sort((a, b) => a.t - b.t).slice(-60);
      const log = $('chatLog'); log.innerHTML = msgs.map(m => `<div><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`).join(''); log.scrollTop = 1e9;
      s.docChanges().forEach(ch => {
        if (ch.type !== 'added') return; const m = ch.doc.data(); if (m.t < joinT) return;
        const holder = m.uid === me.uid ? fig : others[m.uid]?.fig; if (!holder) return;
        if (holder.userData.bubble) holder.remove(holder.userData.bubble);
        const txt = m.text.length > 40 ? m.text.slice(0, 40) + '…' : m.text;
        const b = textSprite(txt, 'rgba(255,255,255,.95)', '#111', 0.75); b.position.y = 7.4; holder.add(b); holder.userData.bubble = b;
        setTimeout(() => { if (holder.userData.bubble === b) { holder.remove(b); holder.userData.bubble = null; } }, 7000);
      });
    }, () => {}));
  }
  function renderPlist() { $('plist').innerHTML = '<b>👥 Hráči</b>' + [prof.name, ...Object.values(others).map(o => o.name)].map(n => `<div>${esc(n)}</div>`).join(''); }
  renderPlist();
  $('chatLog').innerHTML = '';
  sysMsg(testGame ? '🧪 Testovací režim (jen ty)' : '🎮 Vítej ve hře ' + g.name + '!');
  $('pLeave').textContent = testGame ? '⬅ Zpět do Studia' : '⬅ Odejít';

  play = { g, test: !!testGame, presId, unsubs, die, respawn,
    dispose() { el.removeEventListener('pointerdown', cpd); removeEventListener('pointermove', cpm); removeEventListener('pointerup', cpu); removeEventListener('pointercancel', cpu); el.removeEventListener('wheel', wheel); } };

  const fwd = new THREE.Vector3(), right = new THREE.Vector3(), mv = new THREE.Vector3();
  mount({ kind: 'play', scene, camera, host: $('playStage'), dispose: play.dispose,
    update(dt) {
      // input
      let ix = 0, iz = 0;
      if (keys.KeyW || keys.ArrowUp) iz += 1; if (keys.KeyS || keys.ArrowDown) iz -= 1;
      if (keys.KeyD || keys.ArrowRight) ix += 1; if (keys.KeyA || keys.ArrowLeft) ix -= 1;
      ix += joy.x; iz -= joy.y;
      fwd.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)); right.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
      mv.set(0, 0, 0).addScaledVector(fwd, iz).addScaledVector(right, ix);
      if (mv.lengthSq() > 1) mv.normalize();
      if (P.dead > 0) { P.dead -= dt; if (P.dead <= 0) respawn(); mv.set(0, 0, 0); }
      else {
        P.speedT = Math.max(0, P.speedT - dt);
        const spd = 16 * (P.speedT > 0 ? 2 : 1);
        P.vel.x = mv.x * spd; P.vel.z = mv.z * spd;
        if ((keys.Space || jumpHeld) && P.ground) P.vel.y = 50;
        P.vel.y = Math.max(-160, P.vel.y - 196.2 * dt);
        const wg = P.ground; P.ground = false;
        moveAxis(0, P.vel.x * dt, wg); moveAxis(2, P.vel.z * dt, wg); moveAxis(1, P.vel.y * dt, wg);
        if (P.vel.y === 0 && !P.ground && blocked(P.pos.x, P.pos.y - 0.05, P.pos.z)) P.ground = true;
        for (const b of touch) {
          if (!ov(b, P.pos.x, P.pos.y, P.pos.z, 0.08)) continue;
          const k = b.p.k;
          if (k === 'lava') die();
          else if (k === 'spawn') { if (P.lastCheck !== b) { P.lastCheck = b; P.check = [b.p.p[0], b.max[1] + 0.01, b.p.p[2]]; if (b.max[1] > 1) banner('🚩 Checkpoint!', 1200); } }
          else if (k === 'jump') { if (P.vel.y < 80) { P.vel.y = 95; P.ground = false; } }
          else if (k === 'speed') { if (P.speedT < 0.1) banner('⚡ Rychlost!', 1000); P.speedT = 3; }
          else if (k === 'win' && !P.won) {
            P.won = true; banner('🏆 VYHRÁL JSI! 🏆', 4000);
            if (online) addDoc(C('bx_chat'), { g: g.id, uid: me.uid, name: '🏆', text: prof.name + ' dokončil hru!', t: Date.now() }).catch(() => {});
          }
        }
        if (P.pos.y < -60) die();
        if (mv.lengthSq() > 0.01) { const t = Math.atan2(mv.x, mv.z); let d = t - P.ry; d = Math.atan2(Math.sin(d), Math.cos(d)); P.ry += d * Math.min(1, dt * 14); }
      }
      fig.position.copy(P.pos); fig.rotation.y = P.ry;
      const sp = Math.hypot(P.vel.x, P.vel.z);
      animAvatar(fig, sp, dt, !P.ground && P.dead <= 0);
      // camera
      const tg = P.pos.clone(); tg.y += 4.5;
      camera.position.set(tg.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, tg.y + Math.sin(cam.pitch) * cam.dist, tg.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
      camera.lookAt(tg);
      const sun = scene.userData.sun; sun.position.set(P.pos.x + 60, P.pos.y + 120, P.pos.z + 40); sun.target.position.copy(P.pos);
      // others
      for (const o of Object.values(others)) {
        o.fig.position.lerp(o.tgt, Math.min(1, dt * 10));
        let d = o.ry - o.fig.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); o.fig.rotation.y += d * Math.min(1, dt * 10);
        animAvatar(o.fig, o.sp, dt, o.air);
      }
      // send
      if (online) {
        sendT -= dt;
        const st = [r2(P.pos.x), r2(P.pos.y), r2(P.pos.z), r2(P.ry), P.dead > 0 ? 1 : 0].join();
        if (sendT <= 0 && (st !== lastSent || sendT < -3)) {
          sendT = 0.15; lastSent = st;
          setDoc(D('bx_pres', presId), { g: g.id, gn: g.name, uid: me.uid, name: prof.name, av: prof.avatar, x: r2(P.pos.x), y: r2(P.pos.y), z: r2(P.pos.z), ry: r2(P.ry), sp: r2(sp), air: !P.ground, dead: P.dead > 0, t: Date.now() }).catch(() => {});
        }
      }
    } });
  if (online) {
    const hb = setInterval(() => { if (play && play.presId === presId) sendT = -4; }, 4000);
    unsubs.push(() => clearInterval(hb));
  }
}
function leavePlay() {
  if (!play) return;
  const p = play; play = null;
  p.unsubs.forEach(f => f());
  if (p.presId) deleteDoc(D('bx_pres', p.presId)).catch(() => {});
  mount(null);
  $('banner').textContent = '';
}
$('pLeave').onclick = () => {
  const wasTest = play?.test; leavePlay();
  if (wasTest && studio) { show('studio'); mountStudio(); } else goHome();
};
$('pReset').onclick = () => play && play.die();
$('pChatT').onclick = () => $('chatBox').classList.toggle('hidden');
$('chatIn').onkeydown = async e => {
  if (e.key !== 'Enter') return;
  const t = e.target.value.trim(); e.target.value = ''; e.target.blur();
  if (!t || !play) return;
  if (play.test) { toast('V testu se chat neposílá'); return; }
  try { await addDoc(C('bx_chat'), { g: play.g.id, uid: me.uid, name: prof.name, text: t.slice(0, 200), t: Date.now() }); } catch (er) { fail(er); }
};
addEventListener('beforeunload', () => { if (play?.presId) deleteDoc(D('bx_pres', play.presId)).catch(() => {}); });

/* ================= STUDIO ================= */
let studio = null;
async function openStudio(id) {
  let g;
  try { const s = await getDoc(D('bx_games', id)); if (!s.exists()) { toast('Hra neexistuje'); return; } g = { id, ...s.data() }; } catch (e) { fail(e); return; }
  if (g.owner !== me.uid && !isOwner()) { toast('Tohle není tvoje hra 🔒'); return; }
  studio = { g, parts: JSON.parse(JSON.stringify(g.parts || [])), sel: null, mode: 'translate', undo: [], dirty: false };
  $('gName').value = g.name || ''; $('gDesc').value = g.desc || ''; $('gSky').value = g.sky || '#8fd3ff'; $('gPub').checked = !!g.published;
  show('studio'); mountStudio();
}
function mountStudio() {
  const S = studio;
  const scene = makeScene($('gSky').value);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 3000);
  camera.position.set(S.cam ? S.cam[0] : 30, S.cam ? S.cam[1] : 28, S.cam ? S.cam[2] : 36);
  const world = new THREE.Group(); scene.add(world);
  const el = R.domElement;
  const orbit = new OrbitControls(camera, el);
  orbit.target.set(...(S.tgt || [0, 0, 0])); orbit.enableDamping = true; orbit.update();
  const tc = new TransformControls(camera, el);
  tc.setTranslationSnap(0.5); tc.setScaleSnap(0.5); tc.setMode(S.mode);
  tc.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; if (e.value) pushUndo(); });
  tc.addEventListener('objectChange', () => {
    const m = tc.object; if (!m) return;
    m.scale.set(Math.max(0.2, m.scale.x), Math.max(0.2, m.scale.y), Math.max(0.2, m.scale.z));
    const p = m.userData.part; p.p = m.position.toArray().map(r2); p.s = m.scale.toArray().map(r2);
    if (p.t === 'ball') { const v = S.mode === 'scale' ? Math.max(...p.s) : p.s[0]; p.s = [v, v, v]; m.scale.set(v, v, v); }
    if (m.material.map && p.t === 'box') m.material.map.repeat.set(p.s[0] / 4, p.s[2] / 4);
    S.dirty = true; renderProps(true);
  });
  scene.add(tc);
  S.scene = scene; S.world = world; S.tc = tc; S.orbit = orbit; S.camera = camera;
  rebuildWorld();
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  const pd = e => { down = { x: e.clientX, y: e.clientY, gizmo: tc.axis !== null }; };
  const pu = e => {
    if (!down) return; const d = down; down = null;
    if (d.gizmo || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6) return;
    const r = el.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(world.children, false)[0];
    select(hit ? hit.object : null);
  };
  el.addEventListener('pointerdown', pd); el.addEventListener('pointerup', pu);
  mount({ kind: 'studio', scene, camera, host: $('studioStage'),
    update() { orbit.update(); },
    dispose() { S.cam = camera.position.toArray(); S.tgt = orbit.target.toArray(); el.removeEventListener('pointerdown', pd); el.removeEventListener('pointerup', pu); tc.detach(); tc.dispose(); orbit.dispose(); } });
}
function rebuildWorld() {
  const S = studio; S.tc.detach(); S.world.clear();
  for (const p of S.parts) S.world.add(partMesh(p));
  const selP = S.sel; S.sel = null;
  if (selP) { const m = S.world.children.find(c => c.userData.part === selP); if (m) select(m); else renderProps(); } else renderProps();
  $('gCount').textContent = S.parts.length + ' dílů';
}
function select(m) {
  const S = studio;
  if (m && m.userData.part === S.parts[0] && S.parts[0].s[0] >= 200 && S.sel !== S.parts[0]) { /* baseplate: allow but warn by default unselected */ }
  S.sel = m ? m.userData.part : null;
  if (m) S.tc.attach(m); else S.tc.detach();
  renderProps();
}
function selMesh() { return studio.world.children.find(c => c.userData.part === studio.sel); }
function pushUndo() { const S = studio; S.undo.push(JSON.stringify(S.parts)); if (S.undo.length > 40) S.undo.shift(); S.dirty = true; }
function renderProps(onlyNums) {
  const S = studio, p = S.sel, box = $('sProps');
  if (!p) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  if (onlyNums && box.dataset.for === String(S.parts.indexOf(p))) {
    ['x', 'y', 'z'].forEach((a, i) => { $('pp' + a).value = p.p[i]; $('ps' + a).value = p.s[i]; });
    return;
  }
  box.dataset.for = String(S.parts.indexOf(p));
  box.innerHTML = `<b>🧱 Díl</b>
    <label>Typ</label><select id="pk">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${p.k === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <label>Barva</label><div class="opts">${PAL.slice(0, 14).map(c => `<button class="sw" style="background:${c};width:26px;height:26px" data-pc="${c}"></button>`).join('')}<input type="color" id="pcol" value="${p.c}" style="width:40px;height:28px;padding:2px"></div>
    <label>Pozice X / Y / Z</label><div class="xyz">${['x', 'y', 'z'].map((a, i) => `<input type="number" step="0.5" id="pp${a}" value="${p.p[i]}">`).join('')}</div>
    <label>Velikost X / Y / Z</label><div class="xyz">${['x', 'y', 'z'].map((a, i) => `<input type="number" step="0.5" min="0.2" id="ps${a}" value="${p.s[i]}">`).join('')}</div>
    <label>Průhlednost</label><input type="range" min="0" max="0.9" step="0.1" id="ptr" value="${p.tr || 0}">`;
  const apply = () => { const m = selMesh(); if (!m) return; const nm = partMesh(p); studio.world.remove(m); studio.world.add(nm); studio.tc.attach(nm); studio.dirty = true; };
  $('pk').onchange = e => { pushUndo(); p.k = e.target.value; if (KCOL[p.k]) { p.c = KCOL[p.k]; $('pcol').value = p.c; } apply(); };
  box.querySelectorAll('[data-pc]').forEach(b => b.onclick = () => { pushUndo(); p.c = b.dataset.pc; $('pcol').value = p.c; apply(); });
  $('pcol').onchange = e => { pushUndo(); p.c = e.target.value; apply(); };
  ['x', 'y', 'z'].forEach((a, i) => {
    $('pp' + a).onchange = e => { pushUndo(); p.p[i] = +e.target.value || 0; apply(); };
    $('ps' + a).onchange = e => { pushUndo(); p.s[i] = Math.max(0.2, +e.target.value || 1); if (p.t === 'ball') p.s = [p.s[i], p.s[i], p.s[i]]; apply(); renderProps(true); };
  });
  $('ptr').onchange = e => { pushUndo(); p.tr = +e.target.value; apply(); };
}
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  const S = studio; if (!S) return; pushUndo();
  const t = b.dataset.add, tg = S.orbit.target;
  const s = t === 'box' ? [4, 1, 4] : [4, 4, 4];
  const p = { t, p: [Math.round(tg.x), s[1] / 2 + Math.max(0, Math.round(tg.y)), Math.round(tg.z)], s, c: '#a3a2a5', k: 'normal' };
  S.parts.push(p); S.sel = p; rebuildWorld();
});
$('sDup').onclick = () => { const S = studio; if (!S?.sel) return; pushUndo(); const p = JSON.parse(JSON.stringify(S.sel)); p.p[0] += p.s[0] + 1; S.parts.push(p); S.sel = p; rebuildWorld(); };
function delSel() { const S = studio; if (!S?.sel) return; pushUndo(); S.parts.splice(S.parts.indexOf(S.sel), 1); S.sel = null; rebuildWorld(); }
$('sDel').onclick = delSel;
function undo() { const S = studio; if (!S?.undo.length) return; S.parts = JSON.parse(S.undo.pop()); S.sel = null; rebuildWorld(); }
$('sUndo').onclick = undo;
function setMode(m) { studio.mode = m; studio.tc.setMode(m); $('mMove').classList.toggle('on', m === 'translate'); $('mScale').classList.toggle('on', m === 'scale'); }
$('mMove').onclick = () => setMode('translate');
$('mScale').onclick = () => setMode('scale');
$('sGameT').onclick = () => $('sGame').classList.toggle('open');
$('gSky').oninput = e => { if (studio?.scene) { studio.scene.background.set(e.target.value); studio.scene.fog.color.set(e.target.value); studio.dirty = true; } };
['gName', 'gDesc', 'gPub'].forEach(id => $(id).onchange = () => studio && (studio.dirty = true));
addEventListener('keydown', e => {
  if (!studio || $('studio').classList.contains('hidden') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'Delete' || e.key === 'Backspace') delSel();
  else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); $('sDup').onclick(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveStudio(); }
  else if (e.key === 'w' || e.key === 'g') setMode('translate');
  else if (e.key === 'r' || e.key === 's') setMode('scale');
  else if (e.key === 'Escape') select(null);
});
async function saveStudio(quiet) {
  const S = studio; if (!S) return false;
  const data = { name: $('gName').value.trim() || 'Bez názvu', desc: $('gDesc').value.trim(), sky: $('gSky').value, published: $('gPub').checked, parts: S.parts, updated: Date.now() };
  if (JSON.stringify(data).length > 900000) { toast('Hra je moc velká, ubej díly ⚠️'); return false; }
  try { await updateDoc(D('bx_games', S.g.id), data); Object.assign(S.g, data); S.dirty = false; if (!quiet) toast('Uloženo 💾'); return true; } catch (e) { fail(e); return false; }
}
$('sSave').onclick = () => saveStudio();
$('sTest').onclick = () => {
  const S = studio; if (!S) return;
  mount(null);
  startPlay(null, { id: S.g.id, name: $('gName').value, sky: $('gSky').value, parts: JSON.parse(JSON.stringify(S.parts)) });
};
async function closeStudio(save = true) {
  if (!studio) return;
  if (save && studio.dirty) await saveStudio(true);
  studio = null; mount(null);
}
$('sExit').onclick = async () => { await closeStudio(true); toast('Uloženo 💾'); homeTab = 'Create'; goHome(); };
</script>
